# 重点栏目（scope.md 第 2.1 节）
# 按 TMDB 剧集编号直接跟踪，不经过类型筛选，直接收录。
#
# 字段：
#   key          简称
#   name         栏目名
#   tmdb_tv_id   TMDB 剧集编号（https://www.themoviedb.org/tv/<编号>），null = 还没查
#   brand_code   所属品牌（brands.yaml 的 code；不在品牌表里的写 null）
#   themes       预设主题（themes.yaml 的 key）
#   per_episode  是否按集记片源状态（长青栏目为 true）
#   since_year   从哪年起收（默认 2010）
#   enabled      是否收录
#   pilot        是否属于迭代 1 试点

series:
  # —— 迭代 1 试点（编号已在 TMDB 网站核对）——
  # NOVA 3562：PBS，1974 年开播，纪录片类型
  # Horizon 1966：BBC Two，1964 年开播，纪录片类型（同名的 3583、33365 是别的节目）
  # Inside the Factory 72793：BBC Two，2015 年开播，纪录片类型
  - {key: nova, name: NOVA, tmdb_tv_id: 3562, brand_code: US-1, themes: [science], per_episode: true, since_year: 2010, enabled: true, pilot: true}
  - {key: horizon, name: Horizon, tmdb_tv_id: 1966, brand_code: UK-1, themes: [science], per_episode: true, since_year: 2010, enabled: true, pilot: true}
  - {key: inside-the-factory, name: Inside the Factory, tmdb_tv_id: 72793, brand_code: UK-1, themes: [engineering.manufacturing], per_episode: true, since_year: 2010, enabled: true, pilot: true}

