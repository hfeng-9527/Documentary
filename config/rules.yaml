# 初筛规则（scope.md 第 6 节；迭代 1 起）。只产生“建议”，最后由你在审核页决定。
#
# languages   原始语种（TMDB original_language）在这里面的才建议收录；其他语种建议排除，
#             理由写“非中英原产，需确认有英文配音”（scope.md 第 1 节）。cn 是 TMDB 对粤语的写法。
# themes      主题 key（themes.yaml 里的）→ 关键词：
#               tmdb  TMDB 关键词，整个词相同才算（不分大小写）
#               text  标题和简介里出现的词：英文按整词匹配（不分大小写），中文按包含匹配
# exclude     疑似不收的类型（scope.md 第 1 节“不收”）。命中任一项就建议排除，理由写明命中了什么：
#               tmdb_genres  TMDB 类型编号（10764 真人秀、10763 新闻、10767 脱口秀）
#               tmdb / text  同上
#
# 改完运行 uv run doc check-config 检查格式。规则只影响以后新发现的条目（重新判断旧条目是迭代 2a 的 doc reclassify）。

languages: [en, zh, cn]

